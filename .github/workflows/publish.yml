name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.2.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Replaces the retired menu-app package. Every version here is built by this
  # workflow from a clean checkout; menu-app contained hand-built images, one of
  # which carried a developer .env into the registry.
  IMAGE_NAME: julietkiloromeo/menu-editor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and inspect before publishing. An earlier image was built without
      # a .dockerignore and carried the developer's .env -- including a live
      # OpenAI key and a real account password -- into the registry. Nothing is
      # pushed until the image is proven clean.
      - name: Build image for inspection
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: menu-editor:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Searches the whole filesystem rather than a list of known paths. A
      # path-specific check missed frontend/.env, because .dockerignore patterns
      # are anchored at the context root and `.env` alone does not match
      # nested files.
      - name: Refuse to publish secrets or local state
        run: |
          failed=0

          found_env=$(docker run --rm --entrypoint sh menu-editor:candidate -c \
            "find / -xdev -name '.env' -o -xdev -name '.env.*' \
             | grep -v '\.env\.example$' || true")
          if [ -n "$found_env" ]; then
            echo "::error::environment files present in the image:"
            echo "$found_env" | sed 's/^/  /'
            failed=1
          fi

          found_db=$(docker run --rm --entrypoint sh menu-editor:candidate -c \
            "find /app -name '*.db' -o -name 'shopping.md' -o -name 'uge_*.yaml' || true")
          if [ -n "$found_db" ]; then
            echo "::error::local runtime state present in the image:"
            echo "$found_db" | sed 's/^/  /'
            failed=1
          fi

          if docker run --rm --entrypoint sh menu-editor:candidate -c "[ -e /app/.git ]"; then
            echo "::error::/app/.git is present in the image"
            failed=1
          fi

          # Vite inlines VITE_* variables into the bundle, so a leaked secret
          # would be shipped to browsers rather than left in a file.
          leaked=$(docker run --rm --entrypoint sh menu-editor:candidate -c \
            "grep -rEl 'sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
             /app/frontend/dist 2>/dev/null || true")
          if [ -n "$leaked" ]; then
            echo "::error::possible credential inlined into the frontend bundle:"
            echo "$leaked" | sed 's/^/  /'
            failed=1
          fi

          if ! docker run --rm --entrypoint sh menu-editor:candidate \
              -c '[ -f /app/frontend/dist/index.html ]'; then
            echo "::error::frontend/dist/index.html missing - the SPA was not built"
            failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "Image contains no environment files, local state, .git, or inlined credentials."
          fi
          exit $failed

      # Boots the real image against an empty volume, which is what a fresh
      # deployment looks like. Catches both a broken baked venv (the deployed
      # image rebuilt its entire environment on every start, taking ~23 minutes)
      # and workers racing each other during schema creation.
      - name: Smoke test a cold start
        run: |
          docker run -d --name smoke -p 5000:5000 menu-editor:candidate
          ok=0
          for _ in $(seq 1 30); do
            sleep 2
            if curl -fsS --max-time 5 http://localhost:5000/api/recipes >/dev/null 2>&1; then
              ok=1
              break
            fi
          done
          echo "--- container logs ---"
          docker logs smoke 2>&1 | tail -30
          docker rm -f smoke >/dev/null
          if [ "$ok" -ne 1 ]; then
            echo "::error::image did not serve traffic within 60s of a cold start"
            exit 1
          fi
          echo "Cold start served traffic successfully."

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Pin this version in the homelab inventory, then deploy:"
            echo '```'
            echo "./scripts/pin-image.sh ${{ steps.version.outputs.version }} ${{ steps.build.outputs.digest }}"
            echo "cd ../homelab/ansible && bin/deploy valhalla -K"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
